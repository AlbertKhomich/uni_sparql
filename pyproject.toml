[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-sparql-sblp-enrich"
version = "0.1.0"
description = "Enrichment and RDF conversion utilities for the uni_sparql sblp_enrich package."
requires-python = ">=3.10"
dependencies = [
  "bibtexparser>=1.4,<2",
  "pylatexenc>=2.10",
  "rapidfuzz>=3.0",
  "rdflib>=6.0",
  "requests>=2.31",
]

[project.scripts]
sblp-enrich = "sblp_enrich.cli.main:main"
sblp-openalex-enrich = "sblp_enrich.cli.main_openalex:main"
sblp-openalex-offline = "sblp_enrich.cli.main_openalex_offline:main"
sblp-openalex-affiliation-geo = "sblp_enrich.cli.main_openalex_affiliation_geo:main"
sblp-pdf-github-prompt = "sblp_enrich.cli.main_pdf_github_prompt:main"
sblp-answers-to-nt = "sblp_enrich.cli.main_answers_to_nt:main"
sblp-llm-from-prompts = "sblp_enrich.cli.main_llm_from_prompts:main"
sblp-migrate-cache-to-db = "sblp_enrich.cli.migrate_cache_to_db:main"
sblp-bib-keys-and-fields = "sblp_enrich.bib.bib_keys_and_fields:main"
sblp-bib-make-keys-unique-dbid = "sblp_enrich.bib.bib_make_keys_unique_dbid:main"
sblp-bib-repair-all = "sblp_enrich.bib.bib_repair_all:main"
sblp-bib-to-nt = "sblp_enrich.bib.bib_to_nt:main"
sblp-fix-bib-entry-keys = "sblp_enrich.bib.fix_bib_entry_keys:main"
sblp-fix-bib-fields-latex = "sblp_enrich.bib.fix_bib_fields_latex:main"
sblp-canonicalize-iris = "sblp_enrich.rdf.canonicalize_iris:main"
sblp-clean-names-nt = "sblp_enrich.rdf.clean_names_nt:main"
sblp-csv-to-rdf = "sblp_enrich.rdf.csv_to_rdf:main"
sblp-filter-schema-name-symbol-combo = "sblp_enrich.rdf.filter_schema_name_symbol_combo:main"
sblp-fix-problem-names-nt = "sblp_enrich.rdf.fix_problem_names_nt:main"

[tool.setuptools]
script-files = [
  "scripts/sblp_enrich/bib_validate.sh",
  "scripts/sblp_enrich/link.sh",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sblp_enrich*"]
